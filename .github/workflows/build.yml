name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      DFTB_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      DFTB_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      DFTB_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37 build-tools;37.0.0 ndk;27.1.12297006 cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/cache@v4
        with:
          path: .prebuilts-cache
          key: prebuilts-${{ hashFiles('scripts/fetch_prebuilts.sh') }}

      - name: Fetch prebuilts
        run: scripts/fetch_prebuilts.sh
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.1.12297006

      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "DFTB_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew :app:assembleDebug :app:assembleRelease

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: DFTB-apk
          path: app/build/outputs/apk/**/*.apk

      # The companion module reuses the tools fetched above, so it always ships
      # the same binaries as the APK and carries the app's version.
      - name: Pack companion module
        run: companion/pack.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DFTB-Companion
          path: companion/out/*.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            companion/out/*.zip

      # Root managers read companion/update.json to offer the new module.
      - name: Point companion update.json at this release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the zip is named after the app version; the tag should match it
          zip=$(basename companion/out/DFTB-Companion-v*.zip)
          ver=${zip#DFTB-Companion-v}; ver=${ver%.zip}
          IFS=. read -r ma mi pa <<< "$ver"
          code=$((10#$ma * 10000 + 10#$mi * 100 + 10#$pa))
          branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq .defaultBranchRef.name)
          git fetch -q origin "$branch"
          git checkout -q -B "$branch" "origin/$branch"
          cat > companion/update.json <<EOF
          {
            "version": "v$ver",
            "versionCode": $code,
            "zipUrl": "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip",
            "changelog": "https://github.com/$GITHUB_REPOSITORY/releases/tag/$GITHUB_REF_NAME"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add companion/update.json
          git commit -q -m "companion: update.json for v$ver" && git push -q origin "$branch" || echo "update.json unchanged"
