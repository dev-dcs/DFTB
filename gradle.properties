# ---------------------------------------------------------------------------
# DFTB - Don't Forget To Backup
# App identity. The whole rename surface lives here.
# ---------------------------------------------------------------------------
dftb.applicationId=ca.devdcs.backup
dftb.namespace=ca.devdcs.backup
dftb.appName=DFTB

# ---------------------------------------------------------------------------
# SDK levels. Android 10 (API 29) through Android 17 (API 37).
# compileSdk/targetSdk 37 need platforms/android-37.x installed.
# Lower these two if your SDK manager lacks 37.
# ---------------------------------------------------------------------------
dftb.compileSdk=37
dftb.targetSdk=37
dftb.minSdk=29

# Installed NDK / CMake used for the JNI helper library (app/src/main/cpp).
dftb.ndkVersion=27.1.12297006
dftb.cmakeVersion=3.22.1

org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Off: the Kotlin compile task's classpath snapshot isn't serializable into the Gradle 9.x
# configuration cache, so leaving it on fails the build with a serialization error.
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
